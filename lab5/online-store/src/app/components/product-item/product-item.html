<div class="card">
  <img
    class="img"
    [src]="mainImage"
    [alt]="product.name"
    (click)="openKaspi()"
  />

  <div class="thumbs">
    <img
      class="thumb"
      *ngFor="let img of product.images"
      [src]="img"
      [alt]="product.name"
      (click)="setImage(img)"
    />
  </div>

  <h3 class="name">{{ product.name }}</h3>

  <div class="rating">
    <span class="stars">{{ stars(product.rating) }}</span>
    <span class="badge">{{ product.rating }}</span>
  </div>

  <p class="desc">{{ product.description }}</p>

  <div class="price">{{ product.price | number }} ₸</div>

  <div class="actions">
    <button (click)="like()">❤ {{ product.likes }}</button>
    <button (click)="shareWhatsApp()">WhatsApp</button>
    <button (click)="shareTelegram()">Telegram</button>
    <button class="danger" (click)="requestDelete()">Delete</button>
  </div>
</div>
