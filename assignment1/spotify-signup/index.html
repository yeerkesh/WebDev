<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Spotify</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <section class="signup-card">
            <div class="logo">Spotify</div>

            <h1>Sign up for free</h1>
            <p class="subtitle">Create your account to start listening.</p>

            <form>
                <div class="form-group">
                    <label for="email" id="frr">Email address</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                    <small>We'll never share your email with anyone.</small>
                </div>

                <div class="form-group">
                    <label for="password" id="frr">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                    <small>Use 8+ characters for better security.</small>
                </div>

                <div class="form-group">
                    <label for="username" id="frr">Username</label>
                    <input type="text" id="username" placeholder="Pick a display name" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms and Conditions</a></label>
                </div>

                <button type="submit" class="btn-signup">Sign Up</button>
            </form>

            <footer class="card-footer">
                Already have an account? <a href="#">Log in</a>
            </footer>
        </section>
    </main>

</body>
</html>
