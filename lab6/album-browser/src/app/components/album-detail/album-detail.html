<div *ngIf="album">
  <h2>Album ID: {{ album.id }}</h2>
  <p>User ID: {{ album.userId }}</p>
  
  <label>Title: </label>
  <input [(ngModel)]="album.title" placeholder="Edit title">
  
  <br><br>
  <button (click)="save()">Save</button>
  <button (click)="goBack()">Back</button>
  <hr>
  <a [routerLink]="['photos']">View Photos</a>
</div>
