<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook login page</title>
    <link rel="stylesheet" href="facebook.css">
    <link rel="icon" href="https://static.xx.fbcdn.net/rsrc.php/yx/r/e9sqr8WnkCf.ico">
</head>
<body>
    <div class="container">
        <div class="leftpart">
            <img src="4lCu2zih0ca.svg" alt="facebook-logo" class="logo">
            <h2>Facebook помогает вам всегда оставаться на связи и общаться со своими знакомыми.</h2>
        </div>
        <div class="rightpart">
            <div class="loginpage">
                <form action="">
                    <input type="text" placeholder="Электронный адрес или номер телефона">
                    <input type="password" placeholder="Пароль">
                    <input type="submit" value="Вход">
                </form>
                <p><a href="" class="fp">Забыли Пароль?</a></p>
                <hr>
                <div class="createaccount">
                    Создать новый аккаунт
                </div>
                <span><a href="" class="fp" id="abs">Создать Страницу</a> знаменитости, музыкальной группы или компании.</span>
            </div>
        </div>
    </div>
</body> 
</html>
